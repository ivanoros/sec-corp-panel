<div
  class="funding-amount-editor"
  [class.funding-amount-editor--invalid]="!validation().isValid"
  [style.width.px]="editorWidth()"
>
  <input
    #amountInput
    aria-label="Funding amount"
    [attr.aria-describedby]="validation().isValid ? null : 'funding-editor-error'"
    [attr.aria-invalid]="!validation().isValid"
    autocomplete="off"
    class="funding-amount-editor__input"
    inputmode="decimal"
    spellcheck="false"
    type="text"
    [value]="rawValue()"
    (input)="onInput($event)"
    (keydown)="onKeyDown($event)"
  />
  @if (!validation().isValid) {
    <span class="funding-amount-editor__error" id="funding-editor-error" role="alert">
      {{ validation().message }}
    </span>
  }
</div>
