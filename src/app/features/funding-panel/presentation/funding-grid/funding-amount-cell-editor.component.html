<div
  class="funding-amount-editor"
  [class.funding-amount-editor--invalid]="!validation().isValid"
  [style.width.px]="editorWidth()"
>
  <input
    #amountInput
    [attr.aria-describedby]="validation().isValid ? null : errorId"
    [attr.aria-invalid]="!validation().isValid"
    [attr.aria-label]="inputLabel()"
    aria-keyshortcuts="Enter Tab Escape"
    autocomplete="off"
    class="funding-amount-editor__input"
    inputmode="decimal"
    spellcheck="false"
    type="text"
    [value]="rawValue()"
    (blur)="onBlur()"
    (input)="onInput($event)"
    (keydown)="onKeyDown($event)"
  />
  @if (!validation().isValid) {
    <span class="funding-amount-editor__error" [id]="errorId" role="alert">
      {{ validation().message }}
    </span>
  }
</div>
